# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 爱科技
subtitle: '技术博客与数字生活笔记'
description: '技术博客与数字生活笔记'
keywords: 科技, 软件, 数码, 建站, 开源
author: 爱科技
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here.
url: https://aikeji-4rq.pages.dev
root: /
# 与 WordPress 的 /%postname%/ 保持一致
permalink: /:slug/
permalink_defaults:
  slug: ''

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: category
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :slug.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
disable_filename_tr: false
markdown:
  prepend_root: false
  post_asset: false

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
  "建站与运维": web-ops
  "软件与开发": software-dev
  "数码生活": digital-life
  "免费软件": free-software
  "AI 与大模型": ai-models
  "站点公告": site-news
  "Cloudflare": cloudflare
  "60秒读懂世界": 60s-world
tag_map:

# Metadata elements
## https://hexo.io/docs/configuration.html#Metadata-elements
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display dates
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## Use post's date for updated date unless explicitly set
use_date_for_updated: false

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Theme
theme: solitude

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  - type: ''

# 默认封面：文章/页面未设置 cover 时统一套用主题自带 default.avif
# 代码高亮：构建期 hexo 高亮 + 主题自带 mac 风格配色（统一用主题，不再注入外部 hljs）
# auto_detect 让无 language 的围栏也自动识别语言上色
highlight:
  enable: true
  auto_detect: true

theme_config:
  page:
    default:
      cover:
        - /img/default.avif
  post:
    default:
      cover:
        - /img/default.avif
  # 60秒读懂世界卡片样式（jun.la 风格）
  extends:
    head:
      - '<link rel="stylesheet" href="/css/60s-junla.css">'

# Backup to GitHub
backup:
  type: git
  repository:
    github: https://[REDACTED_GITHUB_TOKEN]@github.com/oaoaoaaa/hexo-blog-backup.git,main
  branch: main
